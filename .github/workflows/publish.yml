name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]        # main에 push할 때마다 자동 배포
  workflow_dispatch:         # Actions 탭에서 수동 실행도 가능

permissions:                 # GitHub Pages 배포에 필요한 권한
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.0  # ← 테마 README의 최소 Hugo 버전 이상으로 맞추세요
    steps:
      - name: Install Hugo (extended)
        run: |
          wget -O "$RUNNER_TEMP/hugo.deb" https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"

      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      # 테마에 package.json이 있고 npm 패키지가 필요하면 이 줄의 주석을 해제
      # - run: npm ci

      - name: Build
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
        #  ↑ baseURL을 GitHub Pages 주소로 자동 지정 (CSS 깨짐 방지)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4